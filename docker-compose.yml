services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalpost
      POSTGRES_PASSWORD: signalpost
      POSTGRES_DB: signalpost
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalpost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://signalpost:signalpost@db:5432/signalpost
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo}
    ports:
      - "8000:8000"
    command: >
      bash -lc "alembic upgrade head && uvicorn signalpost.api:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
