name: Signalpost CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Signalpost
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalpost
          POSTGRES_PASSWORD: signalpost
          POSTGRES_DB: signalpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U signalpost -d signalpost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://signalpost:signalpost@localhost:5432/signalpost
      LLM_PROVIDER: openrouter
      LLM_MODEL: openai/gpt-4o-mini
      SEARCH_PROVIDER: duckduckgo
      MAX_REQUESTS: 2000
      MAX_RUNTIME_SECONDS: 2700
      MAX_COST_USD: 10
      HTTP_TIMEOUT: 15
      HTTP_CONCURRENCY: 12
      HTTP_CACHE_TTL_SECONDS: 300
      USER_AGENT: SignalpostBot/1.0 (+public-company-research)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m compileall -q signalpost

      - name: Run tests
        run: |
          pytest -q

      - name: Verify required project files
        run: |
          test -f README.md
          test -f Dockerfile
          test -f docker-compose.yml
          test -f alembic.ini
          test -f .env.example
          test -d alembic
          test -d tests

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t signalpost:ci .
